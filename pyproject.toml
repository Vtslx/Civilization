[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astreusn-civilization-v1"
version = "0.1.0"
description = "Decision, memory, job, and export service with a provider-agnostic runtime"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "SDK.md"
requires-python = ">=3.10"
authors = [{name = "AstreusN"}]
keywords = ["civilization", "memory", "decision-service", "auditable", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# The client, the runtime registry, and the CLI need nothing but the standard library.
dependencies = []

[project.scripts]
civilization = "civilization.cli:main"

[project.urls]
Homepage = "https://github.com/Vtslx/Civilization"
Repository = "https://github.com/Vtslx/Civilization"
Issues = "https://github.com/Vtslx/Civilization/issues"
Documentation = "https://github.com/Vtslx/Civilization/tree/main/docs"

[project.optional-dependencies]
# Host the service in-process: engine, service chain, and local model support.
embedded = [
  "torch>=2.2",
  "transformers==4.57.6",
  "accelerate==1.13.0",
  "safetensors==0.7.0",
  "huggingface_hub==0.36.2",
  "psutil==7.2.2",
  "numpy>=1.26",
  # the adapter codebook path scores clusters with adjusted Rand index
  "scikit-learn>=1.3",
]
# Research runners only: dataset download/caching and dataset loaders.
research = [
  "datasets>=3,<5",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "umap-learn>=0.5",
]
# Run the full test suite: it exercises the engine, so it needs engine deps.
test = [
  "pytest>=8",
  "torch>=2.2",
  "transformers==4.57.6",
  "numpy>=1.26",
  "psutil>=5.9",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "umap-learn>=0.5",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["civilization*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
civilization = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning"]
